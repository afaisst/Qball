<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="felt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f9a5f"/>
      <stop offset="1" stop-color="#17643b"/>
    </linearGradient>
    <radialGradient id="ball" cx="0.38" cy="0.34" r="0.72">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#eef1f2"/>
      <stop offset="0.85" stop-color="#c3cbcf"/>
      <stop offset="1" stop-color="#8f9aa0"/>
    </radialGradient>
    <linearGradient id="maple" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#d9a961"/><stop offset="0.5" stop-color="#f7e2b5"/><stop offset="1" stop-color="#d09a50"/>
    </linearGradient>
    <linearGradient id="butt" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#3a1c0e"/><stop offset="0.5" stop-color="#7a3d1e"/><stop offset="1" stop-color="#3a1c0e"/>
    </linearGradient>
    <clipPath id="tile"><rect width="64" height="64" rx="14"/></clipPath>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#felt)"/>
  <g clip-path="url(#tile)">
    <!-- shadow of the ball on the cloth -->
    <ellipse cx="30.5" cy="31.5" rx="20" ry="19" fill="#0b3a20" opacity="0.45"/>
    <!-- the cue: the tail of the Q -->
    <polygon points="42.81,39.99 44.39,41.41 41.41,44.39 39.99,42.81" fill="#3d8fd6"/>
    <polygon points="44.39,41.41 47.22,43.98 43.98,47.22 41.41,44.39" fill="#f4f1ea"/>
    <polygon points="47.22,43.98 57.61,53.39 53.39,57.61 43.98,47.22" fill="url(#maple)"/>
    <polygon points="57.61,53.39 59.19,54.81 54.81,59.19 53.39,57.61" fill="#2e170c"/>
    <polygon points="59.19,54.81 72.83,67.17 67.17,72.83 54.81,59.19" fill="url(#butt)"/>
    <!-- the cue ball: the O of the Q -->
    <circle cx="28" cy="28" r="18" fill="url(#ball)"/>
    <circle cx="28" cy="28" r="2.6" fill="#d63b3b" opacity="0.9"/>
    <ellipse cx="21.5" cy="20" rx="5" ry="3.2" fill="#ffffff" opacity="0.85" transform="rotate(-35 21.5 20)"/>
  </g>
</svg>
